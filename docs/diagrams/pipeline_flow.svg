<svg width="680" viewBox="0 0 680 1022" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<title>End-to-end pipeline flow</title>
<desc>Inputs feed ingest; an opt-out web-OSINT research stage feeds recon; recon extracts ground truth (invariants, baseline-correct references, variant families, false-positive carve-outs) and bakes it into the audit prompts, along with a deterministic mandatory-coverage checklist gated on cheap repo signals (memory-safety for native code, including a high-signal callout when a free-then-reparse double-free idiom is pre-scanned, crypto-primitive quality, variant-family census, fail-open defaults) so those lenses can't be dropped, plus a closed-ended variant-census worksheet that pre-scans defect families (native free/copy/alloc sinks, memory-safe panic points) and bakes their concrete site+file extent into each prompt so the auditor clears an enumerated checklist instead of stopping at one instance; audit runs parallel focuses plus a completeness-critic re-pass, with an injected impact-discipline rule (report proven impact, not reflexive IMDS/SSRF escalation) and, when supplied, the vendor's accepted-by-design behaviors so intended behavior is not reported as a bug; an opt-out software-composition (dependency) stage flags known-vulnerable pins; validate first clusters cross-focus near-duplicate findings that structural dedup cannot see (same root cause, different call site or focus) via one cheap batched semantic-dedup session, then is ground-truth-aware and downgrades-don't-deletes; an opt-out corroborate stage cross-checks each surviving finding against the project's documentation and the source repo's version-control history (commits, releases, advisories) over public web OSINT, downgrading documented-by-design findings and excluding ones already patched upstream; an opt-in runtime stage builds the target in a sealed loopback-only container and confirms findings with HTTP probes; a separate opt-in (default-off, authorization-gated) live stage makes bounded, in-scope-only, read-only, audit-logged requests to the program's real host to confirm findings; report and a final manual gate handle review and submission. Two modes over the same engine: general code audit (point at a local folder or repo, no brief) or bug-bounty triage (add a program brief). Runs on any backend (Claude Code, Codex/OpenAI, or local open-source).</desc>
