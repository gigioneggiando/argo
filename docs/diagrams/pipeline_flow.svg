<svg width="680" viewBox="0 0 680 1552" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<title>End-to-end pipeline flow</title>
<desc>Execution order of argo pipeline: Stage 0 Ingest creates scope.json; private target memory and optional incremental review; Stage 1 Research (opt-out OSINT); Stage 2 Recon; Stage 3 Audit; optional SCA and second opinion; Stage 4 Validate with citation grounding; optional corroboration, deep verify, ASan PoC, freshness check and sandboxed runtime; a deterministic evidence gate; optional review questions and attack-path composition; Stage 5 Report; a manual review and submission gate. Live probing is a separate, authorization-gated command. Backends: Claude Code, Codex (OpenAI or local open-source models), Gemini, Mistral (API or Vibe).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="1552" fill="#FFFFFF"/>
<text x="340" y="20" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#888">backends: Claude Code · Codex (OpenAI / local-OSS) · Gemini · Mistral (API · Vibe)</text>
<rect x="40" y="44" width="186" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="133" y="63" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">Program brief</text>
<text x="133" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">optional · bug-bounty mode</text>
<rect x="247" y="44" width="186" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="340" y="63" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">Codebase repo</text>
<text x="340" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">local folder or git URL</text>
<rect x="454" y="44" width="186" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="547" y="63" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A" font-weight="500">Useful links</text>
<text x="547" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">site, docs, advisory</text>
<path d="M133 100 L133 142" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M340 100 L340 142" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M547 100 L547 122 L420 122 L420 142" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="144" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="161" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Stage 0 · Ingest</text>
<text x="250" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">brief or folder → scope.json (+ pinned commit)</text>
<path d="M250 192 L250 210" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="212" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="229" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Target memory</text>
<text x="250" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">private, revision-bound facts → recon hints, never evidence</text>
<path d="M250 260 L250 278" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="297" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Incremental review (opt-in)</text>
<text x="250" y="316" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">--incremental-base: diff → changed files, invalidated facts</text>
<path d="M250 328 L250 346" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="348" width="420" height="48" rx="8" fill="#E6F7F2" stroke="#2A8C73" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="365" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#13503F" font-weight="500">Stage 1 · Research 🌐 (opt-out)</text>
<text x="250" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2A8C73">uses Stage 0 scope · OSINT before recon</text>
<path d="M250 396 L250 414" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="416" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="433" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Stage 2 · Recon + synthesis</text>
<text x="250" y="452" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">ground truth → custom prompts</text>
<path d="M250 464 L250 482" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="484" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="501" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Stage 3 · Audit</text>
<text x="250" y="520" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">parallel focuses + critic → findings + variant log</text>
<path d="M250 532 L250 550" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="552" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="569" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">SCA · Dependencies (opt-out)</text>
<text x="250" y="588" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">manifests → known-vulnerable pins</text>
<path d="M250 600 L250 618" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="620" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="637" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Second opinion (opt-in)</text>
<text x="250" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">N blind recon+audit passes → merged in</text>
<path d="M250 668 L250 686" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="688" width="420" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="705" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Stage 4 · Validate</text>
<text x="250" y="724" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">dedup · citation grounding (missing file → drop; symbol → keep)</text>
<text x="250" y="742" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">adversarial review · parse-only context, not flow proof</text>
<path d="M250 754 L250 772" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="774" width="420" height="48" rx="8" fill="#E6F7F2" stroke="#2A8C73" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="791" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#13503F" font-weight="500">Corroborate 🌐 (opt-out)</text>
<text x="250" y="810" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2A8C73">docs + repo history → confirm / discard findings</text>
<path d="M250 822 L250 840" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="842" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="859" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Verify (opt-in)</text>
<text x="250" y="878" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">re-derive from source → split / merge / correct</text>
<path d="M250 890 L250 908" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="910" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="927" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">ASan PoC (opt-in · C/C++)</text>
<text x="250" y="946" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">fixed clang + ASan run, egress-blocked → crash trace</text>
<path d="M250 958 L250 976" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="978" width="420" height="48" rx="8" fill="#E6F7F2" stroke="#2A8C73" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="995" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#13503F" font-weight="500">Freshness check (opt-in)</text>
<text x="250" y="1014" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2A8C73">later commits to cited files → review appendix</text>
<path d="M250 1026 L250 1044" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="1046" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="1063" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Runtime (opt-in)</text>
<text x="250" y="1082" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">sealed loopback container PoC · never live hosts</text>
<path d="M250 1094 L250 1112" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="1114" width="420" height="48" rx="8" fill="#E6F7F2" stroke="#2A8C73" stroke-width="0.6"/>
<text x="250" y="1131" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#13503F" font-weight="500">Evidence gate (deterministic)</text>
<text x="250" y="1150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2A8C73">typed ledger · proof level · open obligations</text>
<path d="M250 1162 L250 1180" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="1182" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="1199" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Review questions (opt-in)</text>
<text x="250" y="1218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">private architecture queue · answers re-validate</text>
<path d="M250 1230 L250 1248" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="1250" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="1267" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Compose (opt-in)</text>
<text x="250" y="1286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">exact-context attack paths for review · no escalation</text>
<path d="M250 1298 L250 1316" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="1318" width="420" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="250" y="1335" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C" font-weight="500">Stage 5 · Report</text>
<text x="250" y="1354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">proof-aware report + submission drafts</text>
<path d="M250 1366 L250 1384" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="1386" width="420" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="250" y="1403" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#711B0C" font-weight="500">You: review + submit 👋</text>
<text x="250" y="1422" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">manual — never automated</text>
<rect x="482" y="482" width="168" height="52" rx="7" fill="#F7F7F5" stroke="#A8A7A3" stroke-width="1" stroke-dasharray="4 3"/>
<text x="566.0" y="495" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#6F6E69" font-weight="500">Opt-in</text>
<text x="566.0" y="511" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6F6E69">chat, fix verification,</text>
<text x="566.0" y="526" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#6F6E69">impact review, accepted risks</text>
<rect x="482" y="1316" width="168" height="52" rx="7" fill="#FCEFCB" stroke="#B07A1E" stroke-width="1" stroke-dasharray="4 3"/>
<text x="566.0" y="1329" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#6B4A0F" font-weight="500">⚠ argo live (opt-in)</text>
<text x="566.0" y="1345" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#8A5D12">separate command · authorized,</text>
<text x="566.0" y="1360" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#8A5D12">in-scope read-only probes</text>
<path d="M460 1342 L480 1342" fill="none" stroke="#B07A1E" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="40" y="1460" width="13" height="13" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="59" y="1467" text-anchor="start" dominant-baseline="central" font-size="12" fill="#444441">inputs</text>
<rect x="116" y="1460" width="13" height="13" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="1467" text-anchor="start" dominant-baseline="central" font-size="12" fill="#444441">automated (offline)</text>
<rect x="283" y="1460" width="13" height="13" rx="3" fill="#E6F7F2" stroke="#2A8C73" stroke-width="0.5"/>
<text x="302" y="1467" text-anchor="start" dominant-baseline="central" font-size="12" fill="#444441">OSINT / evidence</text>
<rect x="429" y="1460" width="13" height="13" rx="3" fill="#FCEFCB" stroke="#B07A1E" stroke-width="0.5"/>
<text x="448" y="1467" text-anchor="start" dominant-baseline="central" font-size="12" fill="#444441">live (opt-in)</text>
<rect x="554" y="1460" width="13" height="13" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="573" y="1467" text-anchor="start" dominant-baseline="central" font-size="12" fill="#444441">manual gate</text>
<text x="40" y="1490" text-anchor="start" dominant-baseline="central" font-size="10.5" fill="#888">dashed border = optional stage (opt-in / opt-out)</text>
<text x="340" y="1512" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#888">Every LLM call: backend + redaction-safe account label in llm_log.jsonl</text>
<text x="340" y="1530" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#888" font-style="italic">Two modes, one engine: omit the brief (dashed) for a general/local code audit; add it for bug-bounty triage.</text>
</svg>
