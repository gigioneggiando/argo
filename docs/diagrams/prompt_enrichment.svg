<svg width="680" viewBox="0 0 680 300" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<title>Prompt enrichment: general to custom</title>
<desc>Reusable assets, scope, and repo recon converge in the synthesis stage, which extracts ground truth (invariants, baseline-correct references, enumerated variant families, false-positive carve-outs) and bakes it into three complementary audit prompts: full-scope, authz, and runtime.</desc>
