[pytest]
# Dedicated, self-cleaning temp base under the project. Avoids pytest's global
# "pytest-of-<user>" base (which can choke on read-only repo copies the pipeline creates on
# Windows). pytest wipes an explicit --basetemp at the start of each run; the env fixture also
# force-removes the read-only runs/ dir after each test.
addopts = --basetemp=.pytest_tmp -p no:cacheprovider
asyncio_mode = strict
testpaths = tests
