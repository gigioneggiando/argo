<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argo — security review workspace</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="assets/argo-mark.svg" />
  <script src="vendor/marked.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/" aria-label="Argo overview">
        <svg class="brand-logo" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" d="M3 32C15 14 49 14 61 32 49 50 15 50 3 32Zm11 0c8-10 28-10 36 0-8 10-28 10-36 0Z"/>
          <circle cx="32" cy="32" r="7.5" fill="currentColor"/>
        </svg>
        <span class="brand-copy"><strong>Argo</strong><small>Security review workspace</small></span>
      </a>

      <a class="btn btn-primary sidebar-action" href="#/new">New audit</a>

      <nav class="nav" id="nav">
        <div class="nav-group">
          <span class="nav-label">Audit</span>
          <a href="#/">Overview</a>
          <a href="#/history">Run history</a>
        </div>
        <div class="nav-group">
          <span class="nav-label">Evidence</span>
          <a href="#/knowledge">Vulnerability index</a>
          <a href="#/benchmark">Benchmarks</a>
          <a href="#/costs">Costs</a>
        </div>
        <div class="nav-group nav-group-bottom">
          <span class="nav-label">System</span>
          <a href="#/settings">Settings</a>
        </div>
      </nav>

      <div class="sidebar-note">
        <span class="local-dot" aria-hidden="true"></span>
        <span><strong>Local workspace</strong><small>Targets stay read-only</small></span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="workspace-context">
          <strong id="screenName">Overview</strong>
          <span>Evidence before certainty</span>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" title="Toggle light or dark theme" aria-label="Toggle theme"></button>
      </header>

      <main id="app"><!-- views render here --></main>
    </div>
  </div>
  <button class="nav-backdrop" id="navBackdrop" type="button" aria-label="Close navigation" hidden></button>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
